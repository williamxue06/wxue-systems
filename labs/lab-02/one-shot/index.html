<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problem Tracker</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --border: #dfe3ea;
    --accent: #2563eb; --accent-text: #ffffff; --danger: #dc2626;
    --open: #2563eb; --progress: #d97706; --resolved: #16a34a; --closed: #6b7280;
    --low: #64748b; --medium: #2563eb; --high: #d97706; --critical: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --border: #2d3442;
    --accent: #3b82f6; --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.45; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.3rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--panel); padding: 7px 12px; border-radius: 6px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); }
  button.small { padding: 3px 9px; font-size: .8rem; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
  textarea { min-height: 90px; resize: vertical; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; box-shadow: var(--shadow); cursor: pointer; text-align: left; }
  .stat .n { font-size: 1.6rem; font-weight: 700; }
  .stat .l { font-size: .8rem; color: var(--muted); }
  .stat.active { outline: 2px solid var(--accent); }

  .toolbar { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  @media (max-width: 760px) { .toolbar { grid-template-columns: 1fr 1fr; } .toolbar .search { grid-column: 1 / -1; } }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card.p-Low { border-left-color: var(--low); } .card.p-Medium { border-left-color: var(--medium); }
  .card.p-High { border-left-color: var(--high); } .card.p-Critical { border-left-color: var(--critical); }
  .card h3 { margin: 0 0 4px; font-size: 1rem; }
  .card .meta { font-size: .82rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .card .desc { font-size: .9rem; margin: 4px 0 6px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .s-Open { background: var(--open); } .s-In-Progress { background: var(--progress); }
  .s-Resolved { background: var(--resolved); } .s-Closed { background: var(--closed); }
  .overdue { color: var(--danger); font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; border: 1px dashed var(--border); border-radius: 8px; }

  dialog { border: 1px solid var(--border); border-radius: 10px; padding: 0; width: min(680px, calc(100vw - 32px)); background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { margin: 0; font-size: 1.1rem; }
  .dlg-body { padding: 16px 18px; max-height: 70vh; overflow: auto; }
  .dlg-foot { display: flex; justify-content: space-between; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid2 .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .err { color: var(--danger); font-size: .82rem; min-height: 1em; }
  .history { margin-top: 18px; }
  .history h4 { margin: 0 0 8px; }
  .entry { border-top: 1px solid var(--border); padding: 8px 0; font-size: .88rem; }
  .entry .when { color: var(--muted); font-size: .78rem; }
  .entry.system { color: var(--muted); font-style: italic; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <h1>Problem Tracker</h1>
  <div class="row">
    <button class="primary" id="newBtn">+ New problem</button>
    <button id="exportBtn" title="Download all problems as a JSON file">Export</button>
    <button id="importBtn" title="Load problems from a JSON file">Import</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button id="themeBtn" title="Toggle light/dark theme">Theme</button>
  </div>
</header>

<main>
  <section class="stats" id="stats" aria-label="Summary counts"></section>

  <section class="toolbar" aria-label="Search and filters">
    <div class="search"><label for="q">Search</label><input id="q" type="search" placeholder="Title, description, people, comments…"></div>
    <div><label for="fStatus">Status</label><select id="fStatus"></select></div>
    <div><label for="fPriority">Priority</label><select id="fPriority"></select></div>
    <div><label for="fCategory">Category</label><select id="fCategory"></select></div>
    <div><label for="sortBy">Sort by</label>
      <select id="sortBy">
        <option value="updated">Recently updated</option>
        <option value="created">Newest first</option>
        <option value="priority">Priority (high → low)</option>
        <option value="due">Due date (soonest)</option>
        <option value="title">Title (A → Z)</option>
      </select>
    </div>
  </section>

  <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
    <span id="count" style="color: var(--muted); font-size: .9rem;"></span>
    <button id="clearFilters">Clear filters</button>
  </div>
  <section class="list" id="list" aria-live="polite"></section>
</main>

<!-- Create / edit dialog -->
<dialog id="editDlg">
  <form id="editForm" method="dialog" novalidate>
    <div class="dlg-head"><h2 id="editTitle">New problem</h2><button type="button" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body">
      <div class="grid2">
        <div class="full"><label for="fTitle">Title *</label><input id="fTitle" maxlength="120" required><div class="err" id="titleErr"></div></div>
        <div class="full"><label for="fDesc">Description</label><textarea id="fDesc" placeholder="What happened? Steps to reproduce, expected vs. actual…"></textarea></div>
        <div><label for="fCat">Category</label><input id="fCat" list="catList" placeholder="e.g. Bug, Hardware, Billing"><datalist id="catList"></datalist></div>
        <div><label for="fPri">Priority</label><select id="fPri"></select></div>
        <div><label for="fFreq">Frequency</label><select id="fFreq"></select></div>
        <div><label for="fStat">Status</label><select id="fStat"></select></div>
        <div><label for="fDue">Due date</label><input id="fDue" type="date"></div>
        <div><label for="fRep">Reported by</label><input id="fRep" maxlength="60"></div>
        <div><label for="fAsg">Assigned to</label><input id="fAsg" maxlength="60"></div>
      </div>
    </div>
    <div class="dlg-foot">
      <span></span>
      <div class="row"><button type="button" data-close>Cancel</button><button type="submit" class="primary">Save</button></div>
    </div>
  </form>
</dialog>

<!-- Detail dialog -->
<dialog id="viewDlg">
  <div class="dlg-head"><h2 id="vTitle"></h2><button type="button" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body">
    <div id="vBody"></div>
    <div class="row" style="margin-top: 12px;">
      <label for="vStatus" style="margin: 0;">Change status:</label>
      <select id="vStatus" style="width: auto;"></select>
    </div>
    <div class="history">
      <h4>Comments &amp; history</h4>
      <form id="commentForm" class="row" style="align-items: stretch;">
        <label for="commentText" class="sr-only">Add a comment</label>
        <input id="commentText" placeholder="Add a comment…" style="flex: 1;">
        <button class="primary" type="submit">Post</button>
      </form>
      <div id="vHistory"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button type="button" class="danger" id="deleteBtn">Delete</button>
    <button type="button" class="primary" id="editBtn">Edit</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // ---------- Constants ----------
  const STORAGE_KEY = 'problemTracker.v1';
  const THEME_KEY = 'problemTracker.theme';
  const STATUSES = ['Open', 'In Progress', 'Resolved', 'Closed'];
  const PRIORITIES = ['Low', 'Medium', 'High', 'Critical'];
  const PRIORITY_RANK = { Low: 1, Medium: 2, High: 3, Critical: 4 };
  const FREQUENCIES = ['Daily', 'Weekly', 'Monthly', 'Rarely'];

  // ---------- State ----------
  let problems = load();
  let editingId = null;  // id being edited, or null when creating
  let viewingId = null;  // id open in the detail dialog

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const nowIso = () => new Date().toISOString();
  const fmtDateTime = (iso) => new Date(iso).toLocaleString();
  const fmtDate = (ymd) => ymd ? new Date(ymd + 'T00:00:00').toLocaleDateString() : '';
  const todayYmd = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const isOverdue = (p) => p.dueDate && p.dueDate < todayYmd() && (p.status === 'Open' || p.status === 'In Progress');
  const statusClass = (s) => 's-' + s.replace(/\s+/g, '-');
  const byId = (id) => problems.find(p => p.id === id);

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    } catch { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(problems)); }
    catch { toast('Could not save — browser storage is full or blocked.'); }
  }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function fillSelect(sel, values, allLabel) {
    sel.innerHTML = (allLabel ? `<option value="">${allLabel}</option>` : '') +
      values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  }
  function categories() {
    return [...new Set(problems.map(p => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  }
  function addHistory(p, text, type = 'system') {
    p.history.unshift({ id: uid(), at: nowIso(), type, text });
  }

  // ---------- Theme ----------
  function applyTheme(t) { document.documentElement.dataset.theme = t; }
  let theme = (() => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } })()
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
  $('themeBtn').onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
  };

  // ---------- Rendering ----------
  function render() {
    renderStats();
    const cur = $('fCategory').value;
    fillSelect($('fCategory'), categories(), 'All categories');
    $('fCategory').value = categories().includes(cur) ? cur : '';
    $('catList').innerHTML = categories().map(c => `<option value="${esc(c)}">`).join('');
    renderList();
  }

  function renderStats() {
    const counts = { All: problems.length };
    STATUSES.forEach(s => counts[s] = problems.filter(p => p.status === s).length);
    const overdue = problems.filter(isOverdue).length;
    const active = $('fStatus').value;
    const tiles = [['All', ''], ...STATUSES.map(s => [s, s])];
    $('stats').innerHTML = tiles.map(([label, val]) =>
      `<button class="stat ${active === val ? 'active' : ''}" data-status="${esc(val)}">
         <div class="n">${counts[label]}</div><div class="l">${label === 'All' ? 'Total problems' : esc(label)}</div>
       </button>`).join('') +
      `<button class="stat ${active === '__overdue' ? 'active' : ''}" data-status="__overdue">
         <div class="n ${overdue ? 'overdue' : ''}">${overdue}</div><div class="l">Overdue</div></button>`;
  }

  function filtered() {
    const q = $('q').value.trim().toLowerCase();
    const st = $('fStatus').value, pr = $('fPriority').value, cat = $('fCategory').value;
    let list = problems.filter(p => {
      if (st === '__overdue' ? !isOverdue(p) : (st && p.status !== st)) return false;
      if (pr && p.priority !== pr) return false;
      if (cat && p.category !== cat) return false;
      if (q) {
        const hay = [p.title, p.description, p.category, p.reporter, p.assignee, ...p.history.filter(h => h.type === 'comment').map(h => h.text)]
          .join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const sort = $('sortBy').value;
    const cmp = {
      updated: (a, b) => b.updatedAt.localeCompare(a.updatedAt),
      created: (a, b) => b.createdAt.localeCompare(a.createdAt),
      priority: (a, b) => PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority] || b.updatedAt.localeCompare(a.updatedAt),
      due: (a, b) => (a.dueDate || '9999') .localeCompare(b.dueDate || '9999'),
      title: (a, b) => a.title.localeCompare(b.title),
    }[sort];
    return list.sort(cmp);
  }

  function renderList() {
    const list = filtered();
    $('count').textContent = `Showing ${list.length} of ${problems.length}`;
    if (!problems.length) {
      $('list').innerHTML = `<div class="empty">No problems yet. Click <strong>+ New problem</strong> to log the first one.</div>`;
      return;
    }
    if (!list.length) {
      $('list').innerHTML = `<div class="empty">No problems match your search or filters.</div>`;
      return;
    }
    $('list').innerHTML = list.map(p => `
      <article class="card p-${esc(p.priority)}" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Open ${esc(p.title)}">
        <div class="row" style="justify-content: space-between;">
          <h3>${esc(p.title)}</h3>
          <div class="row">
            <span class="badge ${statusClass(p.status)}">${esc(p.status)}</span>
            <button type="button" class="danger small" data-delete="${esc(p.id)}" aria-label="Delete problem #${esc(p.number)}">Delete</button>
          </div>
        </div>
        ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
        <div class="meta">
          <span>#${esc(p.number)}</span>
          <span>Priority: ${esc(p.priority)}</span>
          ${p.category ? `<span>${esc(p.category)}</span>` : ''}
          ${p.frequency ? `<span>Happens ${esc(p.frequency.toLowerCase())}</span>` : ''}
          ${p.assignee ? `<span>→ ${esc(p.assignee)}</span>` : '<span>Unassigned</span>'}
          ${p.dueDate ? `<span class="${isOverdue(p) ? 'overdue' : ''}">Due ${fmtDate(p.dueDate)}${isOverdue(p) ? ' (overdue)' : ''}</span>` : ''}
          <span>Updated ${fmtDateTime(p.updatedAt)}</span>
        </div>
      </article>`).join('');
  }

  // ---------- Detail view ----------
  function openView(id) {
    const p = byId(id); if (!p) return;
    viewingId = id;
    $('vTitle').textContent = `#${p.number} ${p.title}`;
    const field = (k, v) => `<div><label>${k}</label><div>${v || '<span style="color:var(--muted)">—</span>'}</div></div>`;
    $('vBody').innerHTML = `
      <div class="grid2">
        <div class="full"><label>Description</label><div style="white-space: pre-wrap;">${esc(p.description) || '<span style="color:var(--muted)">No description</span>'}</div></div>
        ${field('Status', `<span class="badge ${statusClass(p.status)}">${esc(p.status)}</span>`)}
        ${field('Priority', esc(p.priority))}
        ${field('Frequency', esc(p.frequency))}
        ${field('Category', esc(p.category))}
        ${field('Due date', p.dueDate ? `<span class="${isOverdue(p) ? 'overdue' : ''}">${fmtDate(p.dueDate)}${isOverdue(p) ? ' (overdue)' : ''}</span>` : '')}
        ${field('Reported by', esc(p.reporter))}
        ${field('Assigned to', esc(p.assignee))}
        ${field('Created', fmtDateTime(p.createdAt))}
        ${field('Last updated', fmtDateTime(p.updatedAt))}
      </div>`;
    $('vStatus').value = p.status;
    $('vHistory').innerHTML = p.history.length ? p.history.map(h => `
      <div class="entry ${h.type}">
        <div class="when">${fmtDateTime(h.at)}${h.type === 'comment' ? ' · comment' : ''}</div>
        <div style="white-space: pre-wrap;">${esc(h.text)}</div>
      </div>`).join('') : '<div class="entry system">No activity yet.</div>';
    if (!$('viewDlg').open) $('viewDlg').showModal();
  }

  $('vStatus').onchange = (e) => {
    const p = byId(viewingId); if (!p) return;
    const old = p.status, next = e.target.value;
    if (old === next) return;
    p.status = next; p.updatedAt = nowIso();
    addHistory(p, `Status changed: ${old} → ${next}`);
    save(); render(); openView(p.id); toast(`Status set to ${next}`);
  };

  $('commentForm').onsubmit = (e) => {
    e.preventDefault();
    const text = $('commentText').value.trim();
    const p = byId(viewingId); if (!text || !p) return;
    addHistory(p, text, 'comment'); p.updatedAt = nowIso();
    $('commentText').value = '';
    save(); render(); openView(p.id);
  };

  // Shared by the Delete button on each card and the one in the detail view.
  // Returns true if the problem was deleted.
  function deleteProblem(id) {
    const p = byId(id); if (!p) return false;
    if (!confirm(`Delete problem #${p.number} "${p.title}"? This cannot be undone.`)) return false;
    problems = problems.filter(x => x.id !== p.id);
    save(); render(); toast(`Problem #${p.number} deleted`);
    return true;
  }

  $('deleteBtn').onclick = () => { if (deleteProblem(viewingId)) $('viewDlg').close(); };

  $('editBtn').onclick = () => { const id = viewingId; $('viewDlg').close(); openEdit(id); };

  // ---------- Create / edit ----------
  function openEdit(id = null) {
    editingId = id;
    const p = id ? byId(id) : null;
    $('editTitle').textContent = p ? `Edit problem #${p.number}` : 'New problem';
    $('fTitle').value = p?.title ?? '';
    $('fDesc').value = p?.description ?? '';
    $('fCat').value = p?.category ?? '';
    $('fPri').value = p?.priority ?? 'Medium';
    $('fFreq').value = p?.frequency ?? '';
    $('fStat').value = p?.status ?? 'Open';
    $('fDue').value = p?.dueDate ?? '';
    $('fRep').value = p?.reporter ?? '';
    $('fAsg').value = p?.assignee ?? '';
    $('titleErr').textContent = '';
    $('editDlg').showModal();
    $('fTitle').focus();
  }

  $('editForm').onsubmit = (e) => {
    e.preventDefault();
    const data = {
      title: $('fTitle').value.trim(),
      description: $('fDesc').value.trim(),
      category: $('fCat').value.trim(),
      priority: $('fPri').value,
      frequency: $('fFreq').value,
      status: $('fStat').value,
      dueDate: $('fDue').value,
      reporter: $('fRep').value.trim(),
      assignee: $('fAsg').value.trim(),
    };
    if (!data.title) { $('titleErr').textContent = 'Please enter a title.'; $('fTitle').focus(); return; }

    if (editingId) {
      const p = byId(editingId);
      const labels = { title: 'Title', description: 'Description', category: 'Category', priority: 'Priority', frequency: 'Frequency', status: 'Status', dueDate: 'Due date', reporter: 'Reporter', assignee: 'Assignee' };
      const changes = Object.keys(data).filter(k => (p[k] ?? '') !== data[k]);
      if (changes.length) {
        changes.forEach(k => {
          const show = (v) => k === 'description' ? '' : ` “${v || 'none'}”`;
          addHistory(p, k === 'description' ? 'Description edited' : `${labels[k]} changed:${show(p[k])} →${show(data[k])}`);
        });
        Object.assign(p, data, { updatedAt: nowIso() });
        save(); toast('Changes saved');
      }
      $('editDlg').close(); render(); openView(p.id);
    } else {
      const number = problems.reduce((m, p) => Math.max(m, p.number || 0), 0) + 1;
      const p = { id: uid(), number, ...data, createdAt: nowIso(), updatedAt: nowIso(), history: [] };
      addHistory(p, 'Problem created');
      problems.push(p);
      save(); $('editDlg').close(); render(); toast(`Problem #${number} created`);
    }
  };

  // ---------- Export / import ----------
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(problems, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `problems-${todayYmd()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async (e) => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data)) throw new Error('not a list');
      const clean = data.filter(p => p && typeof p.title === 'string' && p.title.trim()).map((p, i) => ({
        id: String(p.id || uid()),
        number: Number(p.number) || i + 1,
        title: String(p.title).trim(),
        description: String(p.description || ''),
        category: String(p.category || ''),
        priority: PRIORITIES.includes(p.priority) ? p.priority : 'Medium',
        frequency: FREQUENCIES.includes(p.frequency) ? p.frequency : '',
        status: STATUSES.includes(p.status) ? p.status : 'Open',
        dueDate: /^\d{4}-\d{2}-\d{2}$/.test(p.dueDate) ? p.dueDate : '',
        reporter: String(p.reporter || ''),
        assignee: String(p.assignee || ''),
        createdAt: p.createdAt || nowIso(),
        updatedAt: p.updatedAt || nowIso(),
        history: Array.isArray(p.history) ? p.history.map(h => ({ id: h.id || uid(), at: h.at || nowIso(), type: h.type === 'comment' ? 'comment' : 'system', text: String(h.text || '') })) : [],
      }));
      if (!confirm(`Import ${clean.length} problem(s)? This replaces your current ${problems.length}.`)) return;
      problems = clean; save(); render(); toast(`Imported ${clean.length} problem(s)`);
    } catch { alert('That file is not a valid Problem Tracker export.'); }
  };

  // ---------- Wiring ----------
  fillSelect($('fStatus'), STATUSES, 'All statuses');
  $('fStatus').insertAdjacentHTML('beforeend', '<option value="__overdue">Overdue only</option>');
  fillSelect($('fPriority'), PRIORITIES, 'All priorities');
  fillSelect($('fPri'), PRIORITIES);
  fillSelect($('fFreq'), FREQUENCIES, 'Not set');
  fillSelect($('fStat'), STATUSES);
  fillSelect($('vStatus'), STATUSES);

  $('newBtn').onclick = () => openEdit();
  ['q', 'fStatus', 'fPriority', 'fCategory', 'sortBy'].forEach(id => $(id).addEventListener('input', () => { renderStats(); renderList(); }));
  $('clearFilters').onclick = () => { $('q').value = ''; ['fStatus', 'fPriority', 'fCategory'].forEach(id => $(id).value = ''); render(); };
  $('stats').onclick = (e) => { const b = e.target.closest('.stat'); if (!b) return; $('fStatus').value = b.dataset.status; renderStats(); renderList(); };
  $('list').onclick = (e) => {
    const del = e.target.closest('[data-delete]');
    if (del) { deleteProblem(del.dataset.delete); return; }  // don't also open the card
    const c = e.target.closest('.card'); if (c) openView(c.dataset.id);
  };
  $('list').onkeydown = (e) => {
    if (e.target.closest('button')) return;  // let Enter/Space activate the Delete button normally
    const c = e.target.closest('.card');
    if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openView(c.dataset.id); }
  };
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'n' && !e.metaKey && !e.ctrlKey && !document.querySelector('dialog[open]') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openEdit(); }
  });
  // Keep data in sync if the app is open in two tabs.
  window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) { problems = load(); render(); } });

  render();
})();
</script>
</body>
</html>
